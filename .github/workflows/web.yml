# ينشر البرنامج موقعاً على GitHub Pages يعمل على كل الأجهزة ويُثبَّت تطبيقاً (PWA).
# فعّل مرة واحدة: إعدادات المستودع ← Pages ← Source: GitHub Actions
name: Web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: بيانات المصحف والتصدير الثابت
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/build_db.py
          python scripts/export_static.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: بناء الموقع
        working-directory: frontend
        env:
          # الموقع يكون على https://<المستخدم>.github.io/<المستودع>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npx vite build --mode web --outDir dist-web
      # دفتر التجويد (PDF): يُبنى من بيانات البرنامج بمتصفح Chrome الموجود في الجهاز
      - name: بناء دفتر التجويد PDF
        run: python scripts/build_notebook.py --out frontend/dist-web/notebook.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
