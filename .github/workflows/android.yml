# يبني تطبيق أندرويد (Capacitor) وينشره آخر إصدار، فيُحمَّل من:
# releases/latest/download/tajweed-hafs.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: بيانات المصحف والتصدير الثابت
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/build_db.py
          python scripts/export_static.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: بناء الواجهة ومزامنة أندرويد
        working-directory: frontend
        run: |
          npm ci
          npx vite build --mode android
          npx cap sync android

      - name: رقم الإصدار
        working-directory: frontend
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # المفتاح نفسه في كل بناء، فيُثبَّت التحديث فوق النسخة القديمة دون فقد التقدّم
      - name: مفتاح التوقيع
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: بناء APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk tajweed-hafs.apk

      # نسخة Google Play: حزمة AAB موقّعة بمفتاح الرفع (من أسرار المستودع)
      - name: بناء AAB لـ Google Play
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        working-directory: frontend/android
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_B64" ]; then echo "لا مفتاح رفع؛ تخطّي AAB"; exit 0; fi
          echo "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          ANDROID_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.p12" ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/tajweed-hafs.aab"
          rm "$RUNNER_TEMP/upload.p12"

      - name: نشر الإصدار
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="tajweed-hafs.apk"
          [ -f tajweed-hafs.aab ] && FILES="$FILES tajweed-hafs.aab"
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest $FILES --target "${{ github.sha }}" --latest \
            --title "تعلّم التجويد 1.0.${{ github.run_number }}" \
            --notes "tajweed-hafs.apk: للتثبيت المباشر على هاتف الأندرويد (ثبّته فوق النسخة القديمة للتحديث). tajweed-hafs.aab: للرفع إلى Google Play Console."
